<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project Controls Report · Siddek Mahmoud</title>
<meta name="description" content="Auto-updating construction dashboards and reports: live S-curves, SPI and CPI, manpower, look-aheads and report packs that build themselves. All data shown is fictional demo data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a product brochure in the site's dark world. Hero with the demo-data notice,
   then the live demo dashboard in an app frame, then the pipeline that feeds it, the
   report that writes itself, what is included, how it is set up, and a call to action. */
:root {
  --bg: #0a0b0d; --bg-2: #111317; --panel: #15181d; --panel-2: #1b1f25;
  --line: rgba(236,235,230,.12); --grid: #262a31; --axis: #3a3f47;
  --ink: #ecebe6; --ink-2: #c3c2b7; --muted: #9b9b94;
  --amber: #f5a524; --amber-ink: #f7b955; --cyan: #7fd4ff;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;            /* planned, actual, third series */
  --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --crit: #d03b3b;
  --f-display: "Alexandria", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --f-sans: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --gutter: clamp(16px, 4vw, 56px);
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-sans); line-height: 1.65; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; border-radius: 6px; }
h1, h2, h3, h4 { margin: 0; font-family: var(--f-display); font-weight: 700; line-height: 1.12; text-wrap: balance; }
html[dir="rtl"] h1, html[dir="rtl"] h2, html[dir="rtl"] h3 { line-height: 1.3; }
p { margin: 0; }
.wrap { width: min(1320px, 100%); margin-inline: auto; padding-left: max(var(--gutter), env(safe-area-inset-left, 0px)); padding-right: max(var(--gutter), env(safe-area-inset-right, 0px)); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.kicker { display: inline-flex; align-items: center; gap: .7rem; font-family: var(--f-mono); font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--amber-ink); }
.kicker::before { content: ""; width: 26px; height: 1px; background: currentColor; }
.h2 { font-size: clamp(1.9rem, 4.6vw, 3.4rem); font-weight: 800; }
.lead { color: var(--muted); font-size: 1.06rem; max-width: 42em; }
.section { padding-block: clamp(4rem, 10vw, 7.5rem); }
.head { display: grid; gap: .9rem; margin-bottom: clamp(2rem, 4vw, 3rem); }
.btn { display: inline-flex; align-items: center; gap: .55rem; padding: .78rem 1.35rem; border-radius: 999px; border: 1px solid var(--line); background: transparent; text-decoration: none; font-weight: 600; cursor: pointer; transition: transform .25s var(--ease), border-color .25s; white-space: nowrap; }
.btn:hover { transform: translateY(-2px); border-color: rgba(236,235,230,.3); }
.btn.solid { background: var(--amber); border-color: var(--amber); color: #120c02; }
.btn.wa { background: #1fae54; border-color: #1fae54; color: #fff; }

/* top bar */
.bar { position: sticky; top: 0; z-index: 30; background: rgba(10,11,13,.82); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
.bar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 1rem; min-height: 60px; }
.bar nav { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
.bar a, .bar button { font-family: var(--f-mono); font-size: .8rem; text-decoration: none; border: 1px solid var(--line); background: transparent; padding: .4rem .8rem; border-radius: 999px; cursor: pointer; white-space: nowrap; }
.bar a:hover, .bar button:hover { border-color: var(--amber); color: var(--amber-ink); }
.brand { display: flex; align-items: center; gap: .6rem; font-family: var(--f-display); font-weight: 700; }
.brand i { width: 30px; height: 30px; border-radius: 50%; background: var(--amber); color: #120c02; display: grid; place-items: center; font-style: normal; font-weight: 800; font-size: .85rem; }
@media (max-width: 640px) { .brand b, .bar .hide-sm { display: none; } }

/* demo notice */
.notice { display: flex; gap: .9rem; align-items: flex-start; padding: 1rem 1.2rem; border: 1px solid rgba(250,178,25,.45); background: rgba(250,178,25,.07); border-radius: 14px; font-size: .95rem; }
.notice svg { width: 22px; height: 22px; flex: none; stroke: var(--warn); fill: none; stroke-width: 1.8; margin-top: .15rem; }
.notice b { color: var(--warn); }

/* hero */
.hero { padding-block: clamp(3rem, 8vw, 6rem) clamp(2rem, 5vw, 3rem); display: grid; gap: 1.4rem; }
.hero h1 { font-size: clamp(2.4rem, 7vw, 5.2rem); font-weight: 800; max-width: 15ch; }
.hero h1 em { font-style: normal; color: var(--amber); }
.hero .lead { font-size: clamp(1.02rem, 1.6vw, 1.2rem); color: var(--ink-2); }
.cta { display: flex; gap: .7rem; flex-wrap: wrap; }
.chips { display: flex; flex-wrap: wrap; gap: .45rem; }
.chips span { font-family: var(--f-mono); font-size: .74rem; padding: .25rem .7rem; border: 1px solid var(--line); border-radius: 999px; color: var(--ink-2); }

/* app frame */
.app { border: 1px solid var(--line); border-radius: 22px; background: var(--bg-2); overflow: hidden; box-shadow: 0 40px 120px rgba(0,0,0,.55), 0 0 0 1px rgba(245,165,36,.05); position: relative; }
.app-top { display: flex; align-items: center; gap: 1rem; padding: .75rem 1rem; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
.dots { display: flex; gap: 6px; direction: ltr; }
.dots i { width: 11px; height: 11px; border-radius: 50%; background: #3a3f47; }
.app-title { font-family: var(--f-display); font-weight: 700; font-size: .98rem; }
.app-meta { margin-inline-start: auto; display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; font-family: var(--f-mono); font-size: .74rem; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: .4rem; padding: .22rem .6rem; border-radius: 999px; border: 1px solid var(--line); }
.pill.demo { color: #120c02; background: var(--warn); border-color: var(--warn); font-weight: 600; letter-spacing: .08em; }
.live { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 0 rgba(12,163,12,.6); }
.syncing .live { background: var(--warn); animation: pulse 1s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(250,178,25,.6); } 100% { box-shadow: 0 0 0 10px rgba(250,178,25,0); } }
.app-body { padding: clamp(.8rem, 2vw, 1.2rem); display: grid; gap: clamp(.7rem, 1.6vw, 1rem); }
.filters { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: .4rem .8rem; font-size: .82rem; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--ink); }
.filters .note-s { margin-inline-start: auto; }
.note-s { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); }

.tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: clamp(.6rem, 1.4vw, .9rem); }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: .9rem 1rem; display: grid; gap: .3rem; align-content: start; min-width: 0; }
.tile small { color: var(--muted); font-size: .78rem; }
.tile b { font-family: var(--f-display); font-size: clamp(1.4rem, 2.6vw, 2rem); font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; text-align: start; }
.tile .sub { font-size: .76rem; color: var(--ink-2); font-family: var(--f-mono); }
.status { display: inline-flex; align-items: center; gap: .35rem; font-size: .74rem; font-weight: 600; justify-self: start; }
.status svg { width: 14px; height: 14px; flex: none; }
.status.good { color: var(--good); } .status.warn { color: var(--warn); } .status.serious { color: var(--serious); } .status.crit { color: #ef6b6b; }
.spark { width: 100%; height: 28px; display: block; direction: ltr; }

.grid2 { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: clamp(.7rem, 1.6vw, 1rem); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 1rem; display: grid; gap: .7rem; align-content: start; min-width: 0; position: relative; }
.card-h { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
.card-h h3 { font-size: 1rem; font-family: var(--f-sans); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: .4rem 1rem; font-size: .76rem; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: .4rem; }
.legend i { display: inline-block; width: 16px; height: 0; border-top: 2px solid; }
.legend i.dash { border-top-style: dashed; }
.legend i.box { width: 10px; height: 10px; border: 0; border-radius: 3px; }
.chart { width: 100%; height: auto; display: block; direction: ltr; overflow: visible; }
.chart text { font-family: var(--f-mono); font-size: 11px; fill: var(--muted); }
.chart .lbl { fill: var(--ink-2); font-size: 12px; }
.tip { position: absolute; pointer-events: none; background: #0d0f12; border: 1px solid var(--line); border-radius: 10px; padding: .5rem .7rem; font-size: .78rem; min-width: 150px; box-shadow: 0 10px 30px rgba(0,0,0,.5); opacity: 0; transition: opacity .15s; z-index: 5; direction: ltr; }
.tip.on { opacity: 1; }
.tip b { display: block; font-family: var(--f-mono); margin-bottom: .25rem; color: var(--ink); }
.tip div { display: flex; align-items: center; gap: .45rem; color: var(--ink-2); font-family: var(--f-mono); }
.tip i { width: 10px; height: 2px; display: inline-block; }

.pk { display: grid; gap: .65rem; }
.pk-row { display: grid; grid-template-columns: minmax(0, 8.5rem) minmax(0, 1fr) 3.4rem; align-items: center; gap: .7rem; font-size: .84rem; }
.pk-row .nm { color: var(--ink-2); overflow-wrap: anywhere; }
.pk-track { position: relative; height: 12px; background: #20242b; border-radius: 4px; direction: ltr; }
.pk-fill { position: absolute; inset-block: 0; left: 0; width: 0; border-radius: 0 4px 4px 0; background: var(--s2); transition: width 1.2s var(--ease); }
.pk-plan { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); border-radius: 1px; transition: left 1.2s var(--ease); }
.pk-row .v { font-family: var(--f-mono); text-align: end; font-variant-numeric: tabular-nums; }

.table-scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .82rem; }
th, td { text-align: start; padding: .55rem .6rem; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
td.num { font-family: var(--f-mono); text-align: end; font-variant-numeric: tabular-nums; }
td .status { font-size: .74rem; }
.feed { display: grid; gap: .45rem; font-family: var(--f-mono); font-size: .76rem; max-height: 214px; overflow: hidden; }
.feed div { display: grid; grid-template-columns: 3.6rem minmax(0, 1fr); gap: .6rem; color: var(--ink-2); animation: feedin .5s var(--ease) both; }
.feed div span:first-child { color: var(--muted); direction: ltr; }
@keyframes feedin { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.watermark { position: absolute; inset-inline-end: 1rem; bottom: .8rem; font-family: var(--f-mono); font-size: .7rem; letter-spacing: .14em; color: rgba(250,178,25,.55); pointer-events: none; }

/* smart site */
.site { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: clamp(.7rem, 1.6vw, 1rem); }
.layout-card { padding-bottom: .8rem; }
.lay { width: 100%; height: auto; display: block; direction: ltr; touch-action: manipulation; }
.lay .villa { cursor: pointer; }
.lay .villa:focus { outline: none; }
.lay .villa:focus .fp, .lay .villa.sel .fp { stroke: var(--amber); stroke-width: 2.5; }
.lay text { font-family: var(--f-mono); font-size: 10px; fill: var(--muted); }
.timeline { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: .7rem; align-items: center; }
.timeline button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel-2); cursor: pointer; display: grid; place-items: center; }
.timeline button svg { width: 16px; height: 16px; fill: var(--ink); }
.timeline input { width: 100%; accent-color: var(--amber); direction: ltr; }
.timeline output { font-family: var(--f-mono); font-size: .8rem; white-space: nowrap; direction: ltr; }
.stg-legend { display: flex; flex-wrap: wrap; gap: .35rem .9rem; font-size: .74rem; color: var(--ink-2); }
.stg-legend span { display: inline-flex; align-items: center; gap: .35rem; }
.stg-legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.stg-count { font-family: var(--f-mono); color: var(--muted); }
.vpanel { display: grid; gap: .8rem; align-content: start; }
.vhead { display: flex; justify-content: space-between; gap: 1rem; align-items: flex-start; flex-wrap: wrap; }
.vhead h3 { font-size: 1.25rem; }
.vhead .sub { color: var(--muted); font-size: .82rem; }
.vbar { height: 8px; background: #20242b; border-radius: 4px; overflow: hidden; direction: ltr; }
.vbar i { display: block; height: 100%; background: var(--s1); border-radius: 0 4px 4px 0; transition: width .5s var(--ease); }
.photo-main { position: relative; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); aspect-ratio: 16 / 9; max-width: 100%; background: #0d0f12; }
.photo-main svg { width: 100%; height: 100%; display: block; }
.thumbs { display: flex; gap: .45rem; overflow-x: auto; padding-bottom: .3rem; direction: ltr; }
.thumbs button { flex: none; width: 92px; padding: 0; border: 2px solid transparent; border-radius: 8px; overflow: hidden; background: none; cursor: pointer; display: grid; }
.thumbs button[aria-pressed="true"] { border-color: var(--amber); }
.thumbs button svg { width: 100%; height: auto; display: block; aspect-ratio: 16 / 9; }
.thumbs button span { font-family: var(--f-mono); font-size: .62rem; color: var(--muted); padding: .2rem 0; background: var(--panel-2); }
.tabs { display: flex; gap: .3rem; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: .45rem .7rem; cursor: pointer; color: var(--muted); font-size: .84rem; }
.tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--amber); }
.recs { display: grid; gap: .5rem; max-height: 300px; overflow-y: auto; }
.rec { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .7rem; padding: .55rem .7rem; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); font-size: .82rem; }
.rec .tag { font-family: var(--f-mono); font-size: .66rem; padding: .15rem .45rem; border-radius: 6px; border: 1px solid var(--line); color: var(--ink-2); align-self: start; white-space: nowrap; }
.rec .tag.ir { border-color: rgba(57,135,229,.6); } .rec .tag.asite { border-color: rgba(245,165,36,.6); } .rec .tag.ncr { border-color: rgba(208,59,59,.7); } .rec .tag.rfi { border-color: rgba(25,158,112,.7); }
.rec b { font-weight: 600; }
.rec .m { font-family: var(--f-mono); font-size: .7rem; color: var(--muted); display: flex; gap: .6rem; flex-wrap: wrap; margin-top: .15rem; }
.rec .m a { color: var(--cyan); text-decoration: none; }

/* xer */
.xer { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(.7rem, 1.6vw, 1rem); }
.xtiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .6rem; }
.xtiles div { background: var(--panel-2); border-radius: 10px; padding: .6rem .75rem; display: grid; gap: .1rem; }
.xtiles b { font-family: var(--f-display); font-size: 1.3rem; direction: ltr; unicode-bidi: isolate; text-align: start; }
.xtiles small { color: var(--muted); font-size: .72rem; }
.dcma td:nth-child(3), .dcma td:nth-child(4) { font-family: var(--f-mono); text-align: end; }
.dcma th:nth-child(3), .dcma th:nth-child(4) { text-align: end; }
@media (max-width: 1080px) { .site, .xer { grid-template-columns: 1fr; } }
@media (max-width: 640px) { .xtiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .timeline { grid-template-columns: auto minmax(0, 1fr); } .timeline output { grid-column: 1 / -1; } }

/* pipeline */
.pipe { border: 1px solid var(--line); border-radius: 22px; background: var(--bg-2); padding: clamp(1rem, 3vw, 2rem); }
.pipe-wrap { overflow-x: auto; }
.pipe svg { width: 100%; min-width: 760px; height: auto; display: block; direction: ltr; }
.pipe text { font-family: var(--f-sans); }

/* report preview */
.report { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(1.2rem, 4vw, 3rem); align-items: center; }
.paper { background: #f4f3ef; color: #16181b; border-radius: 6px; padding: clamp(1.1rem, 3vw, 2rem); box-shadow: 0 30px 80px rgba(0,0,0,.6); transform: rotate(-1.2deg); position: relative; display: grid; gap: .8rem; }
html[dir="rtl"] .paper { transform: rotate(1.2deg); }
.paper .ph { display: flex; justify-content: space-between; gap: 1rem; font-family: var(--f-mono); font-size: .68rem; color: #555b62; border-bottom: 2px solid #16181b; padding-bottom: .5rem; flex-wrap: wrap; }
.paper h4 { font-size: 1.15rem; }
.paper p { font-size: .9rem; color: #2c3036; }
.paper .typing::after { content: "▍"; color: #b86a00; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.paper .mini { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .5rem; }
.paper .mini div { border: 1px solid #d7d5cd; border-radius: 6px; padding: .45rem .55rem; font-size: .72rem; color: #555b62; }
.paper .mini b { display: block; font-family: var(--f-display); font-size: 1.05rem; color: #16181b; direction: ltr; unicode-bidi: isolate; text-align: start; }
.paper .stamp { position: absolute; inset-inline-end: 1rem; top: -12px; background: var(--warn); color: #120c02; font-family: var(--f-mono); font-size: .66rem; font-weight: 600; letter-spacing: .1em; padding: .25rem .6rem; border-radius: 4px; }
.ticks { display: grid; gap: .8rem; margin: 0; padding: 0; list-style: none; }
.ticks li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: .7rem; color: var(--ink-2); }
.ticks svg { width: 22px; height: 22px; stroke: var(--amber); fill: none; stroke-width: 1.8; margin-top: .15rem; }

/* features */
.feat { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; }
.f { padding: 1.5rem; border: 1px solid var(--line); border-radius: 20px; background: var(--bg-2); display: grid; gap: .6rem; align-content: start; }
.f svg { width: 38px; height: 38px; stroke: var(--cyan); fill: none; stroke-width: 1.5; }
.f h3 { font-size: 1.2rem; }
.f p { color: var(--muted); font-size: .93rem; }

/* steps */
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line); }
.st { padding: 1.5rem 1.2rem 1.5rem 0; display: grid; gap: .5rem; align-content: start; border-inline-end: 1px solid var(--line); padding-inline: 1.2rem; }
.st:first-child { padding-inline-start: 0; }
.st:last-child { border-inline-end: 0; }
.st .n { font-family: var(--f-mono); font-size: .76rem; color: var(--amber-ink); }
.st h3 { font-size: 1.15rem; }
.st p { color: var(--muted); font-size: .92rem; }

.final { text-align: center; display: grid; gap: 1.2rem; justify-items: center; }
.final h2 { font-size: clamp(2rem, 5.5vw, 4rem); font-weight: 800; max-width: 18ch; }
footer { border-top: 1px solid var(--line); padding-block: 2rem 3rem; color: var(--muted); font-size: .85rem; display: grid; gap: .8rem; }

@media (max-width: 1080px) {
  .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grid2, .report { grid-template-columns: 1fr; }
  .feat { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .st:nth-child(2) { border-inline-end: 0; }
  .st:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
  .st:nth-child(3) { padding-inline-start: 0; }
}
@media (max-width: 640px) {
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .feat, .steps { grid-template-columns: 1fr; }

/* =========================================================

const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const N = 25, DD = 9;                       // Jan-26 .. Jan-28, data date at index 9 (Oct-26)
const logistic = (t, mid, k) => 1 / (1 + Math.exp(-(t - mid) / k));
function makeProject(mid, k, perf, bias, seed) {
  const a = logistic(0, mid, k), b = logistic(N - 1, mid, k);
  const plan = [...Array(N)].map((_, t) => 100 * (logistic(t, mid, k) - a) / (b - a));
  let r = seed;
  const rnd = () => (r = (r * 9301 + 49297) % 233280) / 233280;
  const actual = plan.slice(0, DD + 1).map((p, t) => Math.max(0, p * (perf - 0.04 * (t / DD) * bias) + (rnd() - 0.5) * 0.6));
  actual[0] = 0;
  const spi = actual[DD] / plan[DD];
  const fc = []; for (let t = DD; t < N; t++) fc.push(t === DD ? actual[DD] : Math.min(100, actual[DD] + (plan[Math.min(N - 1, t + 0)] - plan[DD]) * (0.9 + 0.1 * spi)));
  // stretch the tail so forecast reaches 100 slightly after plan
  fc[fc.length - 1] = Math.min(fc[fc.length - 1], 98.6);
  return { plan, actual, fc, spi };
}

const lvlIdx = (v, good, warn, serious) => (v >= good ? "good" : v >= warn ? "warn" : v >= serious ? "serious" : "crit");
function tween(el, to, dec, suffix = "", ms = 900) {
  const from = parseFloat(el.dataset.v || "0"); el.dataset.v = to;
  if (reduce) { el.textContent = to.toFixed(dec) + suffix; return; }
  const t0 = performance.now();
  const step = (t) => { const k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3); el.textContent = (from + (to - from) * e).toFixed(dec).replace(/\B(?=(\d{3})+(?!\d))/g, dec ? "" : ",") + suffix; if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

        const glass = stage >= 7 ? "#2f4f66" : stage >= 6 ? "#5d7080" : "#3b3a37";
        g += `<rect x="${X + 14}" y="${y0 + 9}" width="26" height="18" fill="${glass}"/><rect x="${X + 88}" y="${y0 + 9}" width="26" height="18" fill="${glass}"/>`;
        if (f === 0) g += `<rect x="${X + 54}" y="${y0 + 8}" width="20" height="26" fill="${stage >= 7 ? "#6b4a2e" : "#3b3a37"}"/>`;
      }
      for (let k = 0; k < 5; k++) g += `<rect x="${X + k * 30}" y="${y0}" width="8" height="34" fill="#a9a59c"/>`;
      g += `<rect x="${X - 6}" y="${y0 - 6}" width="140" height="7" fill="#c3bfb5"/>`;
      if (stage === 5) g += `<path d="M${X + 4} ${y0 + 30} H${X + 124} M${X + 60} ${y0 + 2} V${y0 + 30}" stroke="#d07a2b" stroke-width="1.5" stroke-dasharray="4 2"/>`;
    }
    if (stage === 3) g += `<rect x="${X + 140}" y="40" width="4" height="${B - 40}" fill="#e3a21a"/><path d="M${X + 142} 42 H${X + 30}" stroke="#e3a21a" stroke-width="3"/>`;
    if (stage >= 5 && stage < 7) for (let k = 0; k < 6; k++) g += `<path d="M${X - 10} ${B - 10 * k} H${X - 2} M${X - 10} ${B} V${B - 60}" stroke="#7b8794" stroke-width="1.2"/>`;
    if (stage >= 7) { g += `<rect x="${X - 6}" y="${B - 74}" width="140" height="6" fill="#f6efe2"/><circle cx="${X - 18}" cy="${B - 6}" r="9" fill="#4f8a4a"/><circle cx="${X + 150}" cy="${B - 8}" r="11" fill="#4f8a4a"/><rect x="${X + 160}" y="${B - 2}" width="36" height="10" rx="3" fill="#5a6b7a"/>`; }
  }
  g += `<rect x="6" y="6" width="${big ? 74 : 60}" height="15" rx="3" fill="rgba(0,0,0,.55)"/><text x="12" y="17" fill="#fff" font-family="monospace" font-size="${big ? 9 : 8}">CAM-0${1 + (seed % 3)} · DEMO</text>`;
  g += `<rect x="${320 - (big ? 120 : 102)}" y="160" width="${big ? 114 : 96}" height="15" rx="3" fill="rgba(0,0,0,.55)"/><text x="${320 - (big ? 114 : 97)}" y="171" fill="#f7b955" font-family="monospace" font-size="${big ? 9 : 8}">${stamp}</text>`;
  return `<svg viewBox="0 0 320 180" role="img" aria-label="Illustrated site photo, ${stamp}, demo">${g}</svg>`;
}

function villaRecords(v) {
  const D = d(), out = [], st = stageAt(v, week);
  for (let k = 1; k <= Math.min(st, 7); k++) {
    const s0 = k === 1 ? v.start : v.ends[k - 2], e0 = v.ends[k - 1], act = `V${v.id}-${1000 + (k - 1) * 10}`, an = D.acts[k - 1];
    out.push({ w: s0 + 0.2, type: "diary", txt: D.recTxt.diary.replace("{n}", 6 + ((v.i + k) % 9)).replace("{act}", an), act });
    if (k === 3 || k === 5) out.push({ w: s0 - 0.6, type: "asite", txt: D.recTxt.asite.replace("{r}", String.fromCharCode(65 + (v.i % 3))).replace("{act}", an), act, ref: `PGV-ASITE-SD-${String(v.plot * 3 + k).padStart(4, "0")}` });
    if (k === 5 && v.i % 3 === 0) out.push({ w: s0 + 0.5, type: "rfi", txt: D.recTxt.rfi, act, ref: `PGV-ASITE-RFI-${String(v.plot + k).padStart(4, "0")}` });
    if (k === 3 && v.slow && week > e0) out.push({ w: e0 - 1.5, type: "ncr", txt: D.recTxt.ncr, act, ref: `PGV-ASITE-NCR-${String(v.plot).padStart(4, "0")}` });
    if (week >= e0) { const sti = (v.i + k * 2) % 7 === 0 ? 2 : (v.i + k) % 3 === 0 ? 1 : 0; out.push({ w: e0, type: "ir", txt: D.recTxt.ir.replace("{act}", an).replace("{st}", D.irs[sti]), act, ref: `PGV-ASITE-IR-${String(v.plot * 7 + k).padStart(4, "0")}` }); }
  }
  return out.sort((a, b) => b.w - a.w);
}

function renderPanel() {
  const D = d(), v = VILLAS[sel], st = stageAt(v, week), pct = pctAt(v, week);
  $("#vname").textContent = `Villa ${v.id}`;
  $("#vsub").textContent = D.vsub.replace("{c}", `${D.cl} ${"ABCD"[v.c]}`).replace("{p}", v.plot).replace("{pct}", pct.toFixed(0));
  const stk = st === 7 ? "good" : st === 0 ? "warn" : v.slow ? "serious" : "good";
  $("#vstat").innerHTML = `<span class="status ${stk}">${ICON[stk]}${esc(D.stages[st])}</span>`;
  $("#vbar").style.width = pct + "%";

  const shots = [];
  for (let k = 1; k <= st; k++) { const w = Math.min(week, v.ends[k - 1] - 0.3); shots.push({ k, w, stamp: `${wkDate(Math.floor(w))} ${String(7 + ((v.i + k) % 4)).padStart(2, "0")}:${String((v.plot * k * 7) % 60).padStart(2, "0")}` }); }

    $("#thumbs").innerHTML = shots.map((s0, j) => `<button type="button" aria-pressed="${j === photoSel}" data-j="${j}" aria-label="${esc(D.stages[s0.k])} ${s0.stamp}">${photo2(VILLAS.indexOf(v), s0.k, s0.w, s0.stamp, false)}<span>${esc(D.stages[s0.k])}</span></button>`).join("");

    const rows = D.acts.map((a, k) => {
      const s0 = k === 0 ? v.start : v.ends[k - 1], e0 = v.ends[k];
      const p0 = Math.max(0, Math.min(100, ((week - s0) / (e0 - s0)) * 100));
      return `<tr><td class="mono">V${v.id}-${1000 + k * 10}</td><td>${esc(a)}</td><td class="mono">${wkDate(Math.floor(s0))}</td><td class="mono">${wkDate(Math.floor(e0))}</td><td class="num">${p0.toFixed(0)}</td></tr>`;
    }).join("");

  }
}

/* XER analysis */
function renderXer() {
  const D = d();
  $("#xtiles").innerHTML = D.xt.map(([v0, l]) => `<div><b>${v0}</b><small>${esc(l)}</small></div>`).join("");
  const bands = ["< 0", "0", "1–5", "6–10", "11–20", "21–44", "> 44"], vals = [0, 96, 214, 388, 602, 671, 213];
  const W = 520, H = 220, L = 40, R = 10, Tp = 18, Bt = 26, max = 800;
  const y = (v0) => Tp + (1 - v0 / max) * (H - Tp - Bt), step = (W - L - R) / bands.length, bw = Math.min(24, step * 0.55);
  let g = "";
  [0, 200, 400, 600, 800].forEach((v0) => { g += `<line x1="${L}" x2="${W - R}" y1="${y(v0)}" y2="${y(v0)}" stroke="${v0 ? "var(--grid)" : "var(--axis)"}"/><text x="${L - 6}" y="${y(v0) + 4}" text-anchor="end">${v0 >= 1000 ? (v0 / 1000).toFixed(1) + "K" : v0}</text>`; });
  vals.forEach((v0, i) => {
    const x = L + step * i + (step - bw) / 2, top = y(v0);
    if (v0) g += `<path d="M${x} ${y(0)} V${top + 4} Q${x} ${top} ${x + 4} ${top} H${x + bw - 4} Q${x + bw} ${top} ${x + bw} ${top + 4} V${y(0)} Z" fill="${i <= 1 ? "var(--s2)" : "var(--s1)"}"/>`;
    g += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${bands[i]}</text>`;
    g += `<rect class="fh" data-i="${i}" x="${L + step * i}" y="${Tp}" width="${step}" height="${H - Tp - Bt}" fill="transparent"/>`;
  });
  g += `<text x="${L + step * 1 + step / 2}" y="${y(96) - 6}" text-anchor="middle" class="lbl">96</text>`;
  const svg = $("#fhist"); svg.innerHTML = g;
  const tip = $("#ftip"), card = svg.closest(".card");
  svg.querySelectorAll(".fh").forEach((h) => {
    h.onpointermove = (e) => { const i = +h.dataset.i; tip.innerHTML = `<b>${esc(D.tipFloat)} ${bands[i]}</b><div>${esc(D.tipActs)} ${vals[i].toLocaleString("en-US")}</div>`; placeTip(tip, card, e); };
    h.onpointerleave = () => tip.classList.remove("on");
  });
  $("#dcma").innerHTML = `<thead><tr>${D.dh.map((h) => `<th>${esc(h)}</th>`).join("")}<th></th></tr></thead><tbody>${D.dcma.map(([a, b0, c0, l], i) => `<tr><td>${esc(a)}</td><td style="color:var(--muted)">${esc(b0)}</td><td>${esc(c0)}</td><td>${esc(l)}</td><td>${D.dres[i] ? `<span class="status good">${ICON.good}${esc(D.pass)}</span>` : `<span class="status warn">${ICON.warn}${esc(D.review)}</span>`}</td></tr>`).join("")}</tbody>`;
}

/* =========================================================

const FLOORS = 14;

const TRADES = [[6, 2, 2], [14, 2, 4], [20, 2.1, 3], [24, 2.2, 6]];   // start, per-floor offset, duration (weeks): structure, MEP, facade, finishes
const tradeState = (t, f, w) => { const [s, o, du] = TRADES[t], st = s + o * f + (t === 2 && f >= 7 && f <= 9 ? 3 : 0), en = st + du; return w >= en ? 2 : w >= st ? 1 : 0; };
function isoP(x, y, z) { return [310 + (x - y) * 0.866 * 15, 388 + (x + y) * 0.5 * 15 - z]; }
function poly(pts) { return pts.map((p) => p.map((n) => n.toFixed(1)).join(",")).join(" "); }
function renderBim() {
  const D = d(), svg = $("#iso"); let g = "";

  g += `<polygon points="${poly(gr)}" fill="#12161a" stroke="#262a31"/>`;
  for (let k = -2; k <= 14; k += 4) { g += `<line x1="${isoP(k, -2, 0)[0]}" y1="${isoP(k, -2, 0)[1]}" x2="${isoP(k, 12, 0)[0]}" y2="${isoP(k, 12, 0)[1]}" stroke="#1b2026"/>`; }
  const W0 = 12, D0 = 10, FH = 24;

    const s = TRADES.map((_, t) => tradeState(t, f, bweek));
    const delayed = s[2] === 1 && f >= 7 && f <= 9;

    if (bmode === 0) {

      else if (s[2] >= 1) { left = "#3f7fc4"; right = "#2f679f"; }
      else { left = "#8b939c"; right = "#6c737b"; }
    } else {
      const k = s[3] ? 3 : s[2] ? 2 : s[1] ? 1 : s[0] ? 0 : -1, TC = ["#9aa3ad", "#d97b2b", "#3987e5", "#a0da39"];
      if (k < 0) { left = right = "none"; dash = "3 4"; } else { left = TC[k]; right = TC[k]; }
    }
    const fl = [isoP(0, D0, z0), isoP(W0, D0, z0), isoP(W0, D0, z1), isoP(0, D0, z1)];
    const fr = [isoP(W0, D0, z0), isoP(W0, 0, z0), isoP(W0, 0, z1), isoP(W0, D0, z1)];

    g += `<polygon class="hl" points="${poly(fr)}" fill="${right}" stroke="${stroke}" ${dash ? `stroke-dasharray="${dash}"` : ""} opacity="${bmode === 1 && right !== "none" ? .75 : 1}"/>`;
    if (s[0] >= 1 && bmode === 0 && s[2] >= 1) for (let k = 1; k < 6; k++) { const a = isoP(k * 2, D0, z0), b = isoP(k * 2, D0, z1); g += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="rgba(10,11,13,.35)"/>`; }
    if (f === FLOORS - 1 || tradeState(0, f + 1, bweek) === 0) g += `<polygon points="${poly(top)}" fill="${s[0] ? "#b7bec6" : "none"}" stroke="${stroke}" opacity="${s[0] ? .9 : 1}"/>`;
    g += `</g>`;
  }
  // crane while structure is in progress
  const topF = [...Array(FLOORS).keys()].filter((f) => tradeState(0, f, bweek) >= 1).length;
  if (topF > 0 && topF < FLOORS + 1 && tradeState(0, FLOORS - 1, bweek) < 2) { const b0 = isoP(W0 + 3, -2, 0), b1 = isoP(W0 + 3, -2, (topF + 3) * FH); g += `<line x1="${b0[0]}" y1="${b0[1]}" x2="${b1[0]}" y2="${b1[1]}" stroke="#f5a524" stroke-width="3"/><line x1="${b1[0] - 150}" y1="${b1[1]}" x2="${b1[0] + 40}" y2="${b1[1]}" stroke="#f5a524" stroke-width="3"/><line x1="${b1[0] - 90}" y1="${b1[1]}" x2="${b1[0] - 90}" y2="${b1[1] + 40}" stroke="#c3c2b7"/>`; }
  svg.innerHTML = g;

  $("#bmodes").querySelectorAll("button").forEach((b) => b.onclick = () => { bmode = +b.dataset.k; renderBim(); });

  // Revit categories, % installed at the selected week
  const cats = [[D.b.cat[0], 288, 0], [D.b.cat[1], 28, 0], [D.b.cat[2], 412, 0], [D.b.cat[3], 2316, 1], [D.b.cat[4], 3870, 1], [D.b.cat[5], 1904, 2], [D.b.cat[6], 1260, 3]];
  $("#rvt").innerHTML = `<thead><tr>${D.b.rh.map((h, i) => `<th${i > 1 ? ' style="text-align:end"' : ""}>${esc(h)}</th>`).join("")}</tr></thead><tbody>${cats.map(([c, n, t]) => { const done = [...Array(FLOORS).keys()].reduce((a, f) => a + (tradeState(t, f, bweek) === 2 ? 1 : tradeState(t, f, bweek) === 1 ? 0.5 : 0), 0) / FLOORS; return `<tr><td>${esc(c)}</td><td class="mono">${["A2", "A3", "A4", "A5"][t]}xxx</td><td class="num">${n.toLocaleString("en-US")}</td><td class="num">${(done * 100).toFixed(0)}%</td></tr>`; }).join("")}</tbody>`;

const stProg = (v, k, w, ends) => { const s0 = k === 1 ? v.start : ends[k - 2], e0 = ends[k - 1]; return Math.max(0, Math.min(1, (w - s0) / (e0 - s0))); };
const vPct = (v, w, ends) => { const tot = ends[6] - v.start; return Math.max(0, Math.min(100, ((w - v.start) / tot) * 100)); };
const NW = 80;
const ACT_CURVE = [...Array(NW + 1)].map((_, w) => VILLAS.reduce((a, v) => a + vPct(v, w, v.ends), 0) / VILLAS.length);
const PLAN_CURVE = Array(NW + 1).fill(0);
for (let w = 0; w <= NW; w++) PLAN_CURVE[w] = VILLAS.reduce((a, v, i) => a + vPct(v, w, PLAN_ENDS[i]), 0) / VILLAS.length;
const planFinishW = Math.max(...PLAN_ENDS.map((e) => e[6])), actFinishW = Math.max(...VILLAS.map((v) => v.ends[6]));
const SLIP_D = Math.round((actFinishW - planFinishW) * 7);
let liveBump = 0;

function renderTiles(first) {

  const items = [
    { v: act, dec: 1, suf: "%", sub: `${D.tsub[0]} ${pl.toFixed(1)}%`, st: lvlIdx(spi, 0.97, 0.93, 0.88) },

function renderLook() {

const PAGES = ["exec", "overview", "site", "schedule", "engproc", "eot", "risk", "logistics", "s4d", "bim", "auto"];
const RELOAD = ((performance.getEntriesByType && performance.getEntriesByType("navigation")[0]) || {}).type === "reload";
let page = !RELOAD && PAGES.includes(location.hash.slice(1)) ? location.hash.slice(1) : "exec";   // a reload starts from the first page
function renderTabs() {
  const D = d(), i = PAGES.indexOf(page);
  $("#tabs").innerHTML = PAGES.map((p, k) => `<button type="button" data-p="${p}" ${p === page ? 'aria-current="page"' : ""}>${esc(D.pgShort[k])}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach((b) => b.onclick = () => go(b.dataset.p));
  $("#pgn").textContent = D.pageOf.replace("{i}", i + 1).replace("{n}", PAGES.length);
  $("#prevp").disabled = i === 0; $("#nextp").disabled = i === PAGES.length - 1;
}
function go(p) {
  page = p; if (!EMBED) { try { history.replaceState(null, "", "#" + p); } catch (e) {} }
  document.querySelectorAll(".page").forEach((el) => el.classList.toggle("on", el.id === "pg-" + p));
  renderTabs(); showPage(p);
  const fl = $("#fulllink"); if (fl) fl.href = "./#" + p;
  setTimeout(fit, 60);
  // after a page switch, keep the reader at the top of the new page instead of somewhere below it
  if (booted) setTimeout(() => {
    if (EMBED) { try { parent.postMessage({ type: "pbi-page" }, "*"); } catch (e) {} }
    else { const t = $("#wrapc").getBoundingClientRect().top; if (t < 0) window.scrollTo({ top: t + scrollY - 8, behavior: "instant" }); }
  }, 90);
  booted = true;
}
function showPage(p) {
  if (p === "exec") renderExec();
  if (p === "engproc") renderEngProc();
  if (p === "eot") renderEot();
  if (p === "overview") renderAll(true);
  if (p === "site") { renderLayout(); renderPanel(); }
  if (p === "schedule") renderXer();
  if (p === "risk") { renderRisk(); if (!mcRes) runMC(); }
  if (p === "logistics") renderLogi();
  if (p === "s4d") renderS4();
  if (p === "bim") renderBim();
  if (p === "auto") { renderAuto(); }
}
$("#prevp").onclick = () => go(PAGES[Math.max(0, PAGES.indexOf(page) - 1)]);
$("#nextp").onclick = () => go(PAGES[Math.min(PAGES.length - 1, PAGES.indexOf(page) + 1)]);

/* scale the A4 landscape canvas to the available width */
const EMBED = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
if (EMBED) document.body.classList.add("embed");
let VH_PARENT = 0, lastPosted = 0, booted = false, lastFitW = 0;
// fit the A4 landscape canvas to the visible area: width AND height, so it adapts to browser zoom
function fit() {
  const wrap = $("#wrapc"), c = $("#canvas"), pbi = $("#pbi");
  if (innerWidth < 680) { SCALE = 1; c.style.transform = ""; c.style.left = ""; wrap.style.height = ""; }
  else {
    // letterbox like Power BI "fit to page": the frame keeps its width, the page scales to fit both ways
    const chrome = pbi.offsetHeight - wrap.offsetHeight;
    const vh = EMBED ? (VH_PARENT || 1e5) : innerHeight - 40;
    const sW = wrap.clientWidth / 1400, sH = (vh - chrome) / 990;
    SCALE = Math.max(0.22, Math.min(sW, sH));
    c.style.transform = `scale(${SCALE})`; wrap.style.height = (990 * SCALE) + "px";
    c.style.left = Math.max(0, (wrap.clientWidth - 1400 * SCALE) / 2) + "px";
  }
  if (EMBED) { const h = Math.ceil($("#pbi").getBoundingClientRect().bottom + scrollY + 4); if (Math.abs(h - lastPosted) > 1) { lastPosted = h; try { parent.postMessage({ type: "pbi-height", h }, "*"); } catch (e) {} } }
}
addEventListener("resize", () => { if (innerWidth < 680 && innerWidth === lastFitW) return; lastFitW = innerWidth; fit(); });   // phones: ignore address-bar height changes

/* =========================================================
   BOOT
   ========================================================= */
$("#lang").onclick = () => { lang = lang === "ar" ? "en" : "ar"; store.set("lang", lang); applyText(); renderTabs(); showPage(page); $("#feed").innerHTML = ""; for (let k = 0; k < 4; k++) feedPush(); syncTick(); fit(); };
$("#wk").oninput = (e) => { stopPlay(); setWeek(+e.target.value); };
$("#bwk").oninput = (e) => { stopB(); setBweek(+e.target.value); };
$("#bplay").onclick = () => {
  if (bplaying) return stopB();
  if (week >= 80) setBweek(1);
  $("#bplayic").innerHTML = '<path d="M4 3h3v10H4zM9 3h3v10H9z"/>';
  bplaying = setInterval(() => { if (week >= 80) return stopB(); setBweek(week + 1); }, 320);
};
applyText(); renderAll(true); makeMp();
for (let k = 0; k < 4; k++) feedPush();
go(page); fit(); syncTick();
setTimeout(fit, 300); setTimeout(fit, 1500);
setInterval(syncTick, 1000);
if (!reduce) setInterval(() => { refresh(); }, 7000);
addEventListener("message", (e) => { if (e.data && e.data.type === "pbi-vh" && e.data.h > 200 && Math.abs(e.data.h - VH_PARENT) > 2) { VH_PARENT = e.data.h; if (innerWidth >= 680) fit(); } });
if (window.visualViewport) visualViewport.addEventListener("resize", () => { if (visualViewport.scale === 1) fit(); });
addEventListener("message", (e) => { if (e.data && e.data.type === "pbi-lang" && (e.data.lang === "ar" || e.data.lang === "en") && e.data.lang !== lang) $("#lang").onclick(); });
})();
</script>
</body>
</html>
